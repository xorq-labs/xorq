name: ibis testing data
description: >
  Restore ci/ibis-testing-data from the actions cache, keyed on the upstream
  master commit, and clone it with `just download-data` only on a miss.
  Needs just on PATH. Not for pull_request_target workflows: there the PR
  head would supply this action and could save into the base branch's cache.

# The key and the clone read these same inputs, so a change to the justfile
# recipe's defaults cannot restore data under a stale key.
inputs:
  owner:
    default: ibis-project
  repo:
    default: testing-data
  branch:
    default: master

runs:
  using: composite
  steps:
    - name: Resolve testing-data commit
      id: rev
      shell: bash
      run: |
        line=$(git ls-remote --exit-code "https://github.com/$OWNER/$REPO" "refs/heads/$BRANCH")
        echo "sha=${line%%[[:space:]]*}" >> "$GITHUB_OUTPUT"
      env:
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        BRANCH: ${{ inputs.branch }}

    - name: Restore testing data
      id: cache
      uses: actions/cache/restore@v5.1.0
      with:
        path: ci/ibis-testing-data
        key: ibis-testing-data-${{ steps.rev.outputs.sha }}

    # The clone's .git is half the data and nothing reads it. A cache path
    # exclusion cannot drop it (the directory is archived whole), so delete it.
    - name: download test data
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        just download-data "$OWNER" "$REPO" "$BRANCH"
        rm -rf ci/ibis-testing-data/.git
      env:
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        BRANCH: ${{ inputs.branch }}

    # Each entry is ~0.45 GB against a 10 GB repo quota: save from pushes
    # only, so pull requests restore main's entry instead of writing their own.
    - name: Save testing data
      if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push'
      uses: actions/cache/save@v5.1.0
      with:
        path: ci/ibis-testing-data
        key: ${{ steps.cache.outputs.cache-primary-key }}
