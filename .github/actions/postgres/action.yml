name: postgres
description: >
  Start the compose postgres for the tests: build its image through the GHA
  layer cache, wait until it is healthy, and export the POSTGRES_* and
  XORQ_EXAMPLES_POSTGRES_* variables to the job's later steps. Needs just on
  PATH. Not for pull_request_target workflows: the PR head would supply this
  action and could write into the base branch's layer cache.

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    - name: Build postgres image with GHA layer cache
      uses: docker/bake-action@v7
      with:
        files: compose.yaml
        targets: postgres
        load: true
        set: |
          postgres.cache-from=type=gha,scope=docker-postgres
          postgres.cache-to=type=gha,scope=docker-postgres,mode=max

    - name: Start postgres
      shell: bash
      run: |
        just up-ci postgres
        cat >> "$GITHUB_ENV" <<'ENV'
        POSTGRES_PASSWORD=postgres
        POSTGRES_USER=postgres
        POSTGRES_HOST=localhost
        POSTGRES_PORT=5432
        POSTGRES_DATABASE=ibis_testing
        XORQ_EXAMPLES_POSTGRES_HOST=localhost
        XORQ_EXAMPLES_POSTGRES_USER=postgres
        XORQ_EXAMPLES_POSTGRES_PASSWORD=postgres
        XORQ_EXAMPLES_POSTGRES_DATABASE=ibis_testing
        ENV
