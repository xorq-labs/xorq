name: release-drafter

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  pull_request_target:
    # edited labels title/body edits, but the autolabeler only adds labels.
    # Remove a stale one by hand, e.g. "breaking" after dropping a "!".
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  # v7 moved the autolabeler out of the drafter into its own action. It runs
  # on pull_request_target because fork PRs get a read-only token on
  # pull_request. pull_request_target's token can write even for forks, so
  # never check out or run PR code in this job, and keep the action pinned
  # to a commit SHA.
  autolabel:
    if: github.event_name == 'pull_request_target'
    permissions:
      pull-requests: write  # to add labels to PRs
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          config-name: release-drafter.yml

  update-release-draft:
    if: github.event_name != 'pull_request_target'
    permissions:
      contents: write       # to create/update draft release
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # same commit as the autolabeler: both parse release-drafter.yml
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
