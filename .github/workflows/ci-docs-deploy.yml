name: ci-docs-deploy

on:
  push:
    branches:
      - main
  merge_group:

# only a single docs job that pushes to `main` can run at any given time
concurrency: docs-${{ github.repository }}

permissions:
  # increase the rate limit for GitHub operations, but limit token permissions
  # to read-only
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-just

      - uses: ./.github/actions/ibis-testing-data

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.16"

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-extras --all-groups
        working-directory: ${{ github.workspace }}

      - name: cache quarto
        uses: actions/cache@v5.1.0
        with:
          path: ~/.local/share/quarto
          key: quarto-1.8.24

      - uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: 1.8.24

      # Not .github/actions/postgres: it points connect_examples() at this
      # server, and the published docs should show the public examples data.
      - name: start services
        run: docker compose up postgres --wait --remove-orphans

      - name: build api docs
        run: just docs-apigen --verbose

      - name: build docs
        run: just docs-render
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: ibis_testing

      - name: check that all frozen computations were done before push
        run: git diff --exit-code --stat ':!uv.lock'

      - name: deploy docs
        run: just docs-deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
