name: ci-test-lowest-direct

# Verifies the declared dependency floor. The main ci-test workflow always
# resolves to the newest allowed versions, so `pyproject.toml` lower bounds go
# untested. This job resolves direct dependencies to their lowest allowed
# versions (`uv --resolution lowest-direct`) and runs the core suite, so floor
# violations fail loudly. The `datafusion` extra is synced even though its own
# backend suite is not run, because core tests exercise it (notably the
# parametrized `read_delta` round trip, which covers the datafusion backend's
# override and the test group's `deltalake` floor). See issue #2109.
# Flight tests contribute only those marked `dep_floor`: the ones that exercise
# a third-party API surface (pyarrow.flight, opentelemetry, cloudpickle) rather
# than xorq logic. Today they still carry `core`; the `flight` term keeps them
# selected once flight runs as its own backend.

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      contents: read
      pull-requests: read

  lowest-direct:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests check the floor on the floor Python, plus the newest
        # one when pyproject.toml or uv.lock changed (several bounds split by
        # python_version); pushes check every supported Python.
        python-version: ${{ fromJSON(github.event_name != 'pull_request' && '["3.10", "3.11", "3.12", "3.13"]' || needs.changes.outputs.deps == 'true' && '["3.10", "3.13"]' || '["3.10"]') }}
    steps:
      - uses: actions/checkout@v6

      - name: configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@xorq.dev"

      - uses: ./.github/actions/setup-just

      - uses: ./.github/actions/ibis-testing-data

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Distinct key: this job's floor wheels differ from ci-test.yml's
          # highest-resolution cache (same committed uv.lock hash) and per python.
          cache-suffix: lowest-direct-${{ matrix.python-version }}

      - name: Lock at the dependency floor
        run: uv lock --resolution lowest-direct
        working-directory: ${{ github.workspace }}

      - name: Install the project at the dependency floor
        run: >
          uv sync
          --frozen
          --extra examples
          --extra postgres
          --extra pyiceberg
          --extra sqlite
          --extra ibis
          --extra datafusion
          --group dev --group test
        working-directory: ${{ github.workspace }}

      - uses: ./.github/actions/postgres

      - name: pytest
        timeout-minutes: 20
        run: >
          uv run --no-sync pytest
          --import-mode=importlib
          -m '(core or (flight and dep_floor)) and not uv_export and not slow'
          --ignore=python/xorq/catalog
          -k 'not script_execution'
          -v --durations=20
          -n auto --dist=loadfile
        working-directory: ${{ github.workspace }}
