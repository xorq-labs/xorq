name: ci-benchmark

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: ./.github/actions/setup-just

      - uses: ./.github/actions/ibis-testing-data

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.16"

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --all-groups
        working-directory: ${{ github.workspace }}

      - uses: ./.github/actions/postgres

      # the rest of compose (trino and its metastore); postgres is left running
      - name: start services
        run: docker compose up --build --wait

      - name: Run benchmarks
        run: >
          uv run --no-sync pytest
          --import-mode=importlib
          --benchmark-json=benchmark-results.json
          --benchmark-warmup=on
          -m benchmark
          python/
        working-directory: ${{ github.workspace }}

      - name: Store / compare benchmark results
        uses: benchmark-action/github-action-benchmark@v1.22.2
        with:
          tool: pytest
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "180%"
          comment-on-alert: true
          fail-on-alert: false
