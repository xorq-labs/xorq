name: ci-lint

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  # Deliberately not gated on detect-changes. Those exclusions exist to skip
  # the test suite on a documentation-only pull request, and that reasoning
  # does not carry over to the linters: a prose-only change is the one this job
  # has the most to say about, and it was the one case that ran nothing at all.
  # The job installs only the dev group, so running it everywhere is cheap.
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.13" ]
    steps:
      # fetch-depth: 0 for the changed-lines style gate below --- a shallow
      # clone has no merge base with the target branch.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Prose is listed explicitly rather than scanning the tree, so a
      # generated or vendored file cannot fail the build over wording nobody
      # here chose. CHANGELOG.md is out for that reason: it is assembled from
      # commit messages, so a typo in it is not fixable where it is reported.
      - name: Run codespell
        uses: codespell-project/actions-codespell@v2
        with:
          path: "python src scripts docs README.md CONTRIBUTING.md STYLEGUIDE.md"
          ignore_words_file: .codespell.ignore-words

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --only-group dev

      # Update output format to enable automatic inline annotations.
      - name: Run Ruff
        run: uv run --no-sync ruff check --output-format=github python examples docs scripts

      # Files are expanded with `git ls-files` because xorq-check-style reports
      # nothing and exits 0 when handed a directory (xorq-labs/xorq-style#30).
      #
      # --disable is the ratchet: every rule listed has a nonzero count today.
      # Move a rule off the list once it reaches zero and the gate tightens.
      - name: Style (rules at zero, whole repo)
        shell: bash
        run: |
          set -euo pipefail
          git ls-files 'python/*.py' 'examples/*.py' 'docs/*.py' 'scripts/*.py' \
            | xargs -n 40 uv run --no-sync xorq-check-style --disable \
              type-annotations,pytest-param-id,future-annotations,print,pytest-tmp-path,protected-access,deferred-import-test,redundant-import,os-environ,init-reexport,deferred-stdlib,import-aliasing,stdlib-logging,os-path,test-class,exception-placement,relative-import,exception-hierarchy,enum-placement,cache-method

      # Pull requests only: GITHUB_BASE_REF is empty on push and tag builds, so
      # `git merge-base HEAD origin/` would fail and redden every push to main.
      #
      # pipefail is load-bearing --- an empty diff is a legitimate exit-0 pass,
      # so a failure left of the pipe otherwise reads as clean.
      #
      # The four disabled rules are 93% of the backlog; with them on, touching
      # any signature or parametrize list reddens the PR.
      - name: Style (changed lines)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base=$(git merge-base HEAD "origin/$GITHUB_BASE_REF")
          git diff "$base" HEAD \
            | uv run --no-sync xorq-check-style --diff --disable \
              type-annotations,pytest-param-id,future-annotations,print

      - name: Verify no uncommitted changes
        run: |
          echo "Checking for uncommitted changes in the workspace..."
          if ! git diff --exit-code --stat; then
            echo "::error::Error: The linting process must not create uncommitted files"
            echo "Hint: If you recently updated dependencies or generated files, make sure to commit those changes"
            echo "Hint: Additionally, check that uv version for pre-commit and ci-lint.yaml match and run pre-commit locally"
            exit 1
          fi