name: ci-test-gcs

on:
  workflow_dispatch:
  pull_request_target:
    types:
      - labeled

# Every run that writes to the shared `expr-cache` bucket serialises here.
# The cache key is input-addressed, so each run of a given expression
# targets the SAME object name -- two overlapping runs race on publish and
# drop, and one deletes the object the other is still asserting on.
# Shared with any other workflow that touches the bucket (an RC gate, say):
# the group name is what serialises them, not the workflow.
# cancel-in-progress is false -- cancelling mid-sequence leaves a published
# object undropped, which breaks the next run's opening assertion.
concurrency:
  group: gcs-bucket
  cancel-in-progress: false

permissions:
  contents: read


jobs:
  linux:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci-test-gcs'
    strategy:
      matrix:
        target: ["x86_64"]
        python-version: ["3.11"]
    steps:
      - name: checkout
        uses: actions/checkout@v6
        if: github.event.label.name != 'ci-test-gcs'

      - name: checkout
        if: github.event.label.name == 'ci-test-gcs'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: download test data
        run: just download-data

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install the project
        run: uv sync --extra examples --group dev --group test
        working-directory: ${{ github.workspace }}

      - name: start services
        run: docker compose up --build --wait

      - name: pytest
        run: uv run --no-sync pytest --import-mode=importlib -m gcs python/xorq/ -v --cov --cov-report=xml
        working-directory: ${{ github.workspace }}
        env:
          GCS_ENABLED: True

      - name: Upload coverage reports to Codecov
        if: success()
        continue-on-error: true
        uses: codecov/codecov-action@v5.5.4
        with:
          flags: gcs
          token: ${{ secrets.CODECOV_TOKEN }}

