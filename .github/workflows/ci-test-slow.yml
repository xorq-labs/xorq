name: ci-test-slow

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      contents: read
      pull-requests: read

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: bigger-runner
    strategy:
      matrix:
        include:
          - slow-level: 1
            python-version: "3.12"
          - slow-level: 2
            python-version: "3.12"
          - slow-level: 3
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-just

      - uses: ./.github/actions/ibis-testing-data

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --extra examples --extra postgres --extra pyiceberg --extra ibis --extra datafusion --group dev --group test
        working-directory: ${{ github.workspace }}

      - uses: ./.github/actions/postgres
        if: matrix.slow-level != 3
        with:
          layer-cache: "false"

      - name: pytest
        run: uv run --no-sync -- pytest --verbose --import-mode=importlib --numprocesses auto --dist loadgroup --cov --cov-report=xml -m 'slow(level=${{ matrix.slow-level }})' --durations=70
        working-directory: ${{ github.workspace }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: slow
          fail_ci_if_error: false

