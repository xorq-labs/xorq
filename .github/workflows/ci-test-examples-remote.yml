name: ci-test-examples-remote

# Pull request CI points connect_examples() at the job's own postgres. This
# keeps the public examples server itself under test: once per push to main,
# one job, serial, so it holds a single connection slot at a time.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Merges to main close together: queue runs instead of overlapping them.
concurrency:
  group: examples-remote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --extra examples --extra pyiceberg --extra postgres --extra sqlite --group dev --group test

      # Tests marked examples_remote, i.e. that call connect_examples(); a
      # test file outside this list that gains one must be added here.
      - name: pytest against the public examples server
        run: >
          uv run --no-sync pytest
          --import-mode=importlib
          -v
          -m examples_remote
          python/xorq/tests/test_backend.py
          python/xorq/ibis_yaml/tests/test_compiler.py
          python/xorq/tests/test_examples.py
          python/xorq/tests/test_cli.py
