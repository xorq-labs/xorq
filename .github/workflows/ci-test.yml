name: ci-test

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      contents: read
      pull-requests: read

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
        python-version: ["3.12"]
        backend:
          - name: datafusion
            services: false
            extras:
              - --extra datafusion
          - name: duckdb
            services: false
            extras:
              - --extra duckdb
          - name: xorq_datafusion
            services: false
            extras: []
          - name: xorq_datafusion
            python-version: "3.10"
            services: false
            extras: []
          - name: pyiceberg
            services: false
            extras:
              - --extra pyiceberg
          - name: postgres
            services: postgres
            extras:
              - --extra postgres
              - --extra examples
              - --extra pyiceberg  # test_pyiceberg_catalog: an iceberg catalog in postgres
          - name: pandas
            services: false
            extras: []
          - name: core
            services: postgres
            parallel: true
            extras:
              - --extra examples
              - --extra postgres
              - --extra pyiceberg
              - --extra sqlite
              - --extra ibis
              - --extra datafusion  # core tests parametrize over the datafusion backend
          - name: sqlite
            services: false
            extras:
              - --extra sqlite
              - --extra duckdb
          - name: gizmosql
            services: false
            extras:
              - --extra gizmosql
              - --extra duckdb
          - name: trino
            services: trino
            extras:
              - --extra trino
              - --extra duckdb
    steps:
      - uses: actions/checkout@v6

      - name: configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@xorq.dev"

      - uses: ./.github/actions/setup-just

      - name: download test data
        run: just download-data

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked ${{ join(matrix.backend.extras, ' ') }} --group dev --group test
        working-directory: ${{ github.workspace }}

      # The gizmosql package downloads its server binary from GitHub releases
      # at test time, into a directory named after the package version.
      - name: Read the gizmosql server version
        id: gizmosql
        if: matrix.backend.name == 'gizmosql'
        run: echo "version=$(uv run --no-sync python -c 'import gizmosql; print(gizmosql.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache the gizmosql server binary
        if: matrix.backend.name == 'gizmosql'
        uses: actions/cache@v5
        with:
          path: ~/.cache/gizmosql/v${{ steps.gizmosql.outputs.version }}
          key: gizmosql-${{ steps.gizmosql.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Set up Docker Buildx
        if: ${{ matrix.backend.services }}
        uses: docker/setup-buildx-action@v4

      - name: Build postgres image with GHA layer cache
        if: ${{ contains(matrix.backend.services, 'postgres') }}
        uses: docker/bake-action@v7
        with:
          files: compose.yaml
          targets: postgres
          load: true
          set: |
            postgres.cache-from=type=gha,scope=docker-postgres
            postgres.cache-to=type=gha,scope=docker-postgres,mode=max

      - name: start services
        if: ${{ matrix.backend.services }}
        run: just up-ci ${{ matrix.backend.services }}

      - name: pytest
        timeout-minutes: 20
        run: >
          uv run --no-sync pytest
          --import-mode=importlib
          --cov --cov-report=xml
          -m ${{ matrix.backend.name }}
          --ignore=python/xorq/catalog
          -k 'not script_execution and not slow'
          -v --durations=20
          ${{ matrix.backend.parallel && '-n auto --dist=loadfile' || '' }}
        working-directory: ${{ github.workspace }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: ibis_testing

      # Builds its own wheel and isolated env, so the dev/test groups installed
      # here cannot mask a missing declaration.
      - name: bare-install CLI round trip
        if: matrix.backend.name == 'core'
        timeout-minutes: 10
        run: >
          uv run --no-sync pytest
          --import-mode=importlib
          python/xorq/tests/test_bare_install.py
          -m bare_install
          -v --durations=20
        working-directory: ${{ github.workspace }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: core
          fail_ci_if_error: false
