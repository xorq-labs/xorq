name: ci-test-catalog

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      contents: read
      pull-requests: read

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Run both partitions to completion even if one fails — they're
      # independent backends and a failure in one shouldn't mask the other.
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        # Partition by the `annex` marker (`requires_annex` in
        # python/xorq/catalog/tests/conftest.py, also on the annex storage
        # param): marked tests run in the annex job, everything else in git.
        backend:
          - name: git
            m_filter: "not annex and not slow"
          - name: annex
            m_filter: "annex and not slow"
            # git-annex from PyPI (the `annex` extra): no apt, so no
            # dependence on the runner's Ubuntu mirrors.
            extras: --extra annex
    steps:
      - uses: actions/checkout@v6

      - name: configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@xorq.dev"

      - uses: ./.github/actions/setup-just

      - uses: ./.github/actions/ibis-testing-data

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --group dev --group test ${{ matrix.backend.extras }}
        working-directory: ${{ github.workspace }}

      # Without the binary every annex test skips and the shard passes green.
      - name: check git-annex is installed
        if: matrix.backend.name == 'annex'
        run: uv run --no-sync git-annex version

      - name: pytest
        timeout-minutes: 20
        env:
          M_FILTER: ${{ matrix.backend.m_filter }}
        run: >
          uv run --no-sync pytest
          --import-mode=importlib
          --cov --cov-report=xml
          python/xorq/catalog/tests
          -m "$M_FILTER"
          -v --durations=20 -n auto --dist=loadfile
        working-directory: ${{ github.workspace }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: catalog-${{ matrix.backend.name }}
