name: ci-test-examples

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      contents: read
      pull-requests: read

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ["x86_64"]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-just

      - uses: ./.github/actions/ibis-testing-data

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --extra examples --extra pyiceberg --extra postgres --extra sqlite --group dev --group test
        working-directory: ${{ github.workspace }}

      - uses: ./.github/actions/postgres

      # The Hacker News examples fetch ~1,000 items one request at a time, so
      # keep them between runs. Keyed on the fetchers that run (the pinned
      # hackernews_lib versions the examples load, the local lib, and
      # flight_udtf_example's own) with no fallback key: a change to any starts
      # cold, so the live fetch path runs whenever it changes.
      - name: Hacker News fetcher fingerprint
        id: hackernews
        run: |
          fingerprint=$(
            {
              grep -oh '"hackernews_lib", version="[^"]*"' examples/*.py | sort -u
              cat examples/libs/hackernews_lib.py examples/flight_udtf_example.py
            } | sha256sum | cut -c1-16
          )
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache Hacker News items
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/hackernews-items
          key: hackernews-items-${{ steps.hackernews.outputs.fingerprint }}

      - name: pytest
        run: uv run --no-sync pytest --import-mode=importlib python/xorq/tests/test_examples.py -v -n auto --dist=loadgroup --durations=10 --cov --cov-report=xml
        working-directory: ${{ github.workspace }}
        env:
          HACKERNEWS_ITEMS_DIR: ${{ runner.temp }}/hackernews-items
          WEATHER_FEATURES_PORT: 8819
          WEATHER_API_URL: https://api.openweathermap.org/data/2.5/weather
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: examples
          fail_ci_if_error: false

