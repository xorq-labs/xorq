name: ci-test-examples

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      contents: read
      pull-requests: read

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ["x86_64"]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-just

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --extra examples --extra pyiceberg --extra postgres --extra sqlite --group dev --group test
        working-directory: ${{ github.workspace }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build postgres image with GHA layer cache
        uses: docker/bake-action@v7
        with:
          files: compose.yaml
          targets: postgres
          load: true
          set: |
            postgres.cache-from=type=gha,scope=docker-postgres
            postgres.cache-to=type=gha,scope=docker-postgres,mode=max

      - name: start services
        run: just up-ci postgres

      # The Hacker News examples fetch ~1,000 items one request at a time; the
      # items are fixed by the pinned input, so keep them between runs.
      - name: Cache Hacker News items
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/hackernews-items
          key: hackernews-items-${{ hashFiles('examples/*.py') }}
          restore-keys: hackernews-items-

      - name: pytest
        run: uv run --no-sync pytest --import-mode=importlib python/xorq/tests/test_examples.py -v -n auto --dist=loadgroup --durations=10 --cov --cov-report=xml
        working-directory: ${{ github.workspace }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: ibis_testing
          XORQ_EXAMPLES_POSTGRES_HOST: localhost
          XORQ_EXAMPLES_POSTGRES_USER: postgres
          XORQ_EXAMPLES_POSTGRES_PASSWORD: postgres
          XORQ_EXAMPLES_POSTGRES_DATABASE: ibis_testing
          HACKERNEWS_ITEMS_DIR: ${{ runner.temp }}/hackernews-items
          WEATHER_FEATURES_PORT: 8819
          WEATHER_API_URL: https://api.openweathermap.org/data/2.5/weather
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: examples
          fail_ci_if_error: false

