name-template: 'xorq unreleased'
version-template: unreleased

change-template: '- $TITLE (#$NUMBER)'

autolabeler:
  # The body rule matches a "BREAKING CHANGE:" line anywhere, because real
  # footers can sit mid-body (#1869). An unindented example in a code block
  # matches too. Indent it: the next push or edit re-adds a removed label
  # while the line is there.
  - label: 'breaking'
    title:
      - '/^\w+(\([^)]*\))?!:/'
    body:
      - '/^BREAKING[ -]CHANGE:/m'
  # release and dependencies mirror the pre-exclude title conditions below,
  # which are authoritative. Change them together. The conditions match type
  # and scope case-sensitively and need a space after the colon, so these
  # regexes have no /i and end in ": ".
  - label: 'release'
    title:
      - '/^release(\(.*\))?!?: /'
  - label: 'dependencies'
    title:
      - '/^chore\(deps\): /'
      - '/^fix\(deps\): /'
  - label: 'perf'
    title:
      - '/^perf(\(.*\))?!?:/i'
  - label: 'feature'
    title:
      - '/^feat(\(.*\))?!?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.*\))?!?:/i'
  - label: 'docs'
    title:
      - '/^docs(\(.*\))?!?:/i'
      - '/^chore\(docs\):/i'
  - label: 'ci'
    title:
      - '/^ci(\(.*\))?!?:/i'
      - '/^chore\(ci\):/i'
  - label: 'chore'
    title:
      - '/^chore(\(.*\))?!?:/i'
  - label: 'internal'
    title:
      - '/^ref(\(.*\))?!?:/i'
      - '/^refactor(\(.*\))?!?:/i'
      - '/^spike(\(.*\))?!?:/i'

categories:
  # v7 refuses the deprecated top-level exclude-labels next to a pre-exclude
  # category, so the labels live here. The title conditions are authoritative:
  # they drop release and deps PRs even when the autolabeler never ran.
  - type: pre-exclude
    when:
      - labels:
          - ignore
          - release
          - dependencies
      - conventional:
          type: release
      # breaking: false matches only titles without "!" (unset matches both),
      # so like the dependencies autolabel rule, "fix(deps)!:" stays in the draft
      - conventional:
          types:
            - chore
            - fix
          scope: deps
          breaking: false
  # the title condition still catches "!" PRs the autolabeler never labelled
  - title: 💥 Breaking changes
    exclusive: true
    when:
      - label: breaking
      - conventional:
          breaking: true
  - title: 🚀 Performance improvements
    labels:
      - performance
      - perf
  - title: ✨ Enhancements
    labels:
      - feature
      - enhancement
  - title: 🐞 Bug fixes
    labels:
      - fix
      - bugfix
      - bug
  - title: 📖 Documentation
    labels:
      - documentation
      - docs
  - title: 📦 Build system
    labels:
      - build
      - ci
      - chore
  - title: 🛠️ Other improvements
    labels:
      - internal
      - maintenance

template: |
  ## Changes

  $CHANGES

  Thank you to all our contributors for making this release possible!
  $CONTRIBUTORS
