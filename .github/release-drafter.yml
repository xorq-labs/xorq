name-template: 'xorq unreleased'
version-template: unreleased

change-template: '- $TITLE (#$NUMBER)'

autolabeler:
  - label: 'breaking'
    title:
      - '/^\w+(\([^)]*\))?!:/'
    body:
      - '/^BREAKING[ -]CHANGE:/m'
  - label: 'release'
    title:
      - '/^release:/i'
  - label: 'dependencies'
    title:
      - '/^chore\(deps\):/i'
      - '/^fix\(deps\):/i'
  - label: 'perf'
    title:
      - '/^perf(\(.*\))?!?:/i'
  - label: 'feature'
    title:
      - '/^feat(\(.*\))?!?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.*\))?!?:/i'
  - label: 'docs'
    title:
      - '/^docs(\(.*\))?!?:/i'
      - '/^chore\(docs\):/i'
  - label: 'ci'
    title:
      - '/^ci(\(.*\))?!?:/i'
      - '/^chore\(ci\):/i'
  - label: 'chore'
    title:
      - '/^chore(\(.*\))?!?:/i'
  - label: 'internal'
    title:
      - '/^ref(\(.*\))?!?:/i'
      - '/^refactor(\(.*\))?!?:/i'
      - '/^spike(\(.*\))?!?:/i'

categories:
  # v7 refuses the deprecated top-level exclude-labels next to a pre-exclude
  # category, so the labels live here. The title condition drops release PRs
  # even without the "release" label.
  - type: pre-exclude
    when:
      - labels:
          - ignore
          - release
          - dependencies
      - conventional:
          type: release
  # the title condition still catches "!" PRs the autolabeler never labelled
  - title: 💥 Breaking changes
    exclusive: true
    when:
      - label: breaking
      - conventional:
          breaking: true
  - title: 🚀 Performance improvements
    labels:
      - performance
      - perf
  - title: ✨ Enhancements
    labels:
      - feature
      - enhancement
  - title: 🐞 Bug fixes
    labels:
      - fix
      - bugfix
      - bug
  - title: 📖 Documentation
    labels:
      - documentation
      - docs
  - title: 📦 Build system
    labels:
      - build
      - ci
      - chore
  - title: 🛠️ Other improvements
    labels:
      - internal
      - maintenance

template: |
  ## Changes

  $CHANGES

  Thank you to all our contributors for making this release possible!
  $CONTRIBUTORS
