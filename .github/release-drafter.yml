name-template: 'xorq unreleased'
version-template: unreleased

change-template: '- $TITLE (#$NUMBER)'

autolabeler:
  # These rules run on pull_request_target with a write token, and the
  # ci-test-* and docs-preview workflows start on a label. Never add a rule
  # whose label matches one of theirs, and never give the autolabeler a PAT:
  # labels added with GITHUB_TOKEN cannot start a workflow, a PAT's can.
  #
  # A breaking change is declared by a human: "!" in the title, which also
  # reaches the squash commit, or the breaking label added by hand. A deps PR
  # is dropped on the title alone (pre-exclude below, which cannot exempt a
  # label), so retitle it with "!". Release PRs are the version bump and are
  # always dropped. PR bodies are not scanned.
  - label: 'breaking'
    title:
      - '/^\w+(\([^)]*\))?!:/'
  # release and dependencies mirror the pre-exclude title conditions below,
  # which are authoritative. Change them together. The conditions match type
  # and scope case-sensitively and need a space after the colon, so these
  # regexes have no /i and end in ": ".
  - label: 'release'
    title:
      - '/^release(\(.*\))?!?: /'
  - label: 'dependencies'
    title:
      - '/^chore\(deps\): /'
      - '/^fix\(deps\): /'
  - label: 'perf'
    title:
      - '/^perf(\(.*\))?!?:/i'
  - label: 'feature'
    title:
      - '/^feat(\(.*\))?!?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.*\))?!?:/i'
  - label: 'docs'
    title:
      - '/^docs(\(.*\))?!?:/i'
      - '/^chore\(docs\):/i'
  - label: 'ci'
    title:
      - '/^ci(\(.*\))?!?:/i'
      - '/^chore\(ci\):/i'
  - label: 'chore'
    title:
      - '/^chore(\(.*\))?!?:/i'
  - label: 'internal'
    title:
      - '/^ref(\(.*\))?!?:/i'
      - '/^refactor(\(.*\))?!?:/i'
      - '/^spike(\(.*\))?!?:/i'

categories:
  # v7 refuses the deprecated top-level exclude-labels next to a pre-exclude
  # category, so the labels live here. The title conditions are authoritative:
  # they drop release and deps PRs even when the autolabeler never ran.
  - type: pre-exclude
    when:
      - labels:
          - ignore
          - release
      # The autolabeler never removes labels, so a deps PR retitled with "!"
      # keeps dependencies. The label only counts on a conventional title
      # without "!", so a plain "Bump x from 1 to 2" stays in the draft.
      - labels:
          - dependencies
        conventional:
          breaking: false
      - conventional:
          type: release
      # breaking: false matches only titles without "!" (unset matches both),
      # so like the dependencies autolabel rule, "fix(deps)!:" stays in the draft
      - conventional:
          types:
            - chore
            - fix
          scope: deps
          breaking: false
  # the title condition still catches "!" PRs the autolabeler never labelled
  - title: 💥 Breaking changes
    exclusive: true
    when:
      - label: breaking
      - conventional:
          breaking: true
  # Each category below also matches PR titles by conventional type, so a PR
  # the autolabeler never labelled still gets a section. Unlike the type rules
  # above (perf to internal), these need a lowercase type followed by ": ".
  - title: 🚀 Performance improvements
    when:
      - labels:
          - performance
          - perf
      - conventional:
          type: perf
  - title: ✨ Enhancements
    when:
      - labels:
          - feature
          - enhancement
      - conventional:
          type: feat
  - title: 🐞 Bug fixes
    when:
      - labels:
          - fix
          - bugfix
          - bug
      - conventional:
          type: fix
  - title: 📖 Documentation
    when:
      - labels:
          - documentation
          - docs
      - conventional:
          type: docs
      - conventional:
          type: chore
          scope: docs
  - title: 📦 Build system
    when:
      - labels:
          - build
          - ci
          - chore
      - conventional:
          types:
            - ci
            - chore
  - title: 🛠️ Other improvements
    when:
      - labels:
          - internal
          - maintenance
      - conventional:
          types:
            - ref
            - refactor
            - spike
  # catch-all: without it, uncategorized PRs (test:, style:, build:, plain
  # titles) render with no heading above Breaking changes
  - title: 🧹 Other changes

template: |
  ## Changes

  $CHANGES

  Thank you to all our contributors for making this release possible!
  $CONTRIBUTORS
