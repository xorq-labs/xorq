ci:
  autofix_commit_msg: "style: auto fixes from pre-commit.ci hooks"
  autofix_prs: false
  autoupdate_commit_msg: "chore(deps): pre-commit.ci autoupdate"
  skip:
    - ruff
default_install_hook_types:
  - pre-commit
  - post-checkout
default_stages:
  - pre-commit
repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        args: [--ignore-words=.codespell.ignore-words]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.12
    hooks:
      # Run the linter.
      # These trees are a floor, not a scope: pre-commit appends the staged
      # files, so a staged Python file outside them is linted too, making this
      # hook broader than CI, which lints these trees and nothing else. The
      # hook runs only when a Python, stub or notebook file is staged, and its
      # `--force-exclude` still applies ruff's default excludes to what
      # pre-commit hands it. The list is the third copy of LINT_PATHS in
      # ci-lint.yml (the second is `paths` in
      # scripts/check-style-diff.sh); test_lint_paths_agree in
      # scripts/style_tests/ fails when the three diverge.
      - id: ruff-check
        args: ["--output-format=full", "--fix", "python", "examples", "docs", "scripts"]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.8
    hooks:
      # Update the uv lockfile
      - id: uv-lock
  - repo: local
    hooks:
      # The same script CI runs, over the staged diff rather than base...HEAD:
      # the diff, not the staged files, so pre-existing violations in a file you
      # touch stay out of the way.
      - id: xorq-check-style
        name: xorq style (changed lines)
        entry: scripts/check-style-diff.sh --cached
        language: script
        types: [python]
        pass_filenames: false
      - id: git-blame-ignore-revs
        name: configure blame.ignoreRevsFile
        entry: git config --replace-all blame.ignoreRevsFile .git-blame-ignore-revs
        language: system
        stages:
          - post-checkout
        always_run: true
        pass_filenames: false
